apiVersion: v1
kind: ServiceAccount
metadata:
  name: attacknet-chaos-dashboard
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/name: attacknet-chaos-dashboard-access
    app.kubernetes.io/part-of: stacks-attacknet
---
apiVersion: v1
kind: Secret
metadata:
  name: attacknet-chaos-dashboard-token
  namespace: chaos-mesh
  annotations:
    kubernetes.io/service-account.name: attacknet-chaos-dashboard
  labels:
    app.kubernetes.io/name: attacknet-chaos-dashboard-access
    app.kubernetes.io/part-of: stacks-attacknet
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: attacknet-chaos-dashboard
  labels:
    app.kubernetes.io/name: attacknet-chaos-dashboard-access
    app.kubernetes.io/part-of: stacks-attacknet
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: attacknet-chaos-dashboard
  labels:
    app.kubernetes.io/name: attacknet-chaos-dashboard-access
    app.kubernetes.io/part-of: stacks-attacknet
subjects:
  - kind: ServiceAccount
    name: attacknet-chaos-dashboard
    namespace: chaos-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: attacknet-chaos-dashboard
