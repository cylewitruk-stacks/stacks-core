regtest=1

[regtest]
printtoconsole=1
disablewallet=0
txindex=1
discover=0
dns=0
dnsseed=0
listenonion=0
server=1
rest=1
rpcbind=0.0.0.0:18443
rpcallowip=0.0.0.0/0
rpcallowip=::/0
rpcuser=devnet
rpcpassword=devnet
addresstype=legacy
changetype=legacy
fallbackfee=0.00001
# Never carry a block commit made against the pre-restart miner view into the
# resumed process. The restarted node must submit a fresh commit using its
# persisted active VRF registration before the helper mines another block.
persistmempool=0
# The watch-only miner wallets retain unconfirmed transaction history. Do not
# let loading them republish pre-restart block commits after the empty mempool
# check; stacks-node submits each newly constructed raw commit explicitly.
walletbroadcast=0
