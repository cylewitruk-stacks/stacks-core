apiVersion: testing.stacks.org/v1beta1
kind: FaultCampaign
metadata:
  name: ddmin-live-network-negative-template
  namespace: hacknet-system
spec:
  template: true
  safety:
    maxUnavailableSignerBasisPoints: 3000
    maxUnavailableMinerBasisPoints: 5000
    maxConcurrentFaults: 1
    allowQuorumLoss: false
    allowBurnchain: false
    allowExtendedDuration: false
    allowExtremeSeverity: false
    allowMinerMajorityOutage: false
    allowUnenrolledNetworkTargets: false
  stages:
    - id: duplicate-traffic
      faults:
        - id: follower-duplicate
          target:
            actors: [follower-1]
            mode: all
          fault:
            type: network
            action: duplicate
            mode: all
            duration: 15s
            parameters:
              direction: both
              peerTarget:
                actors: [miner-1]
                mode: all
              duplicate:
                duplicate: "10"
                correlation: "0"
  effectAssertions:
    - type: NetworkDegraded
      actor: follower-1
      timeoutSeconds: 90
  recoveryAssertions:
    - type: NetworkRecovered
      actor: follower-1
      timeoutSeconds: 300
