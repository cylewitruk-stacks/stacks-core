apiVersion: testing.stacks.org/v1beta1
kind: FaultCampaign
metadata:
  name: ddmin-live-pod-template
  namespace: hacknet-system
spec:
  template: true
  safety:
    maxUnavailableSignerBasisPoints: 3000
    maxUnavailableMinerBasisPoints: 5000
    maxConcurrentFaults: 1
    allowQuorumLoss: false
    allowBurnchain: false
    allowExtendedDuration: false
    allowExtremeSeverity: false
    allowMinerMajorityOutage: false
    allowUnenrolledNetworkTargets: false
  stages:
    - id: restart-follower
      faults:
        - id: follower-pod-kill
          target:
            actors: [follower-1]
            mode: all
          fault:
            type: pod
            action: pod-kill
            mode: one
            duration: 10s
            parameters:
              gracePeriod: 0
  effectAssertions:
    - type: PodRestarted
      actor: follower-1
      timeoutSeconds: 90
  recoveryAssertions:
    - type: TargetReady
      actor: follower-1
      timeoutSeconds: 300
