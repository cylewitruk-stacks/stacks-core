{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "attacknetruns.testing.stacks.org",
    "labels": {"app.kubernetes.io/name": "hacknet"}
  },
  "spec": {
    "group": "testing.stacks.org",
    "scope": "Namespaced",
    "names": {
      "plural": "attacknetruns",
      "singular": "attacknetrun",
      "kind": "AttacknetRun",
      "shortNames": ["arun"],
      "categories": ["all"]
    },
    "versions": [{
      "name": "v1alpha1",
      "served": true,
      "storage": true,
      "additionalPrinterColumns": [
        {"name": "Phase", "type": "string", "jsonPath": ".status.phase"},
        {"name": "Network", "type": "string", "jsonPath": ".spec.networkRef"},
        {"name": "Active", "type": "string", "jsonPath": ".status.activeCampaign"},
        {"name": "Campaigns", "type": "integer", "jsonPath": ".status.budgetUsage.campaigns"},
        {"name": "Attribution", "type": "string", "jsonPath": ".status.attribution"},
        {"name": "Evidence", "type": "string", "jsonPath": ".status.evidenceURI", "priority": 1},
        {"name": "Age", "type": "date", "jsonPath": ".metadata.creationTimestamp"}
      ],
      "subresources": {"status": {}},
      "schema": {
        "openAPIV3Schema": {
          "type": "object",
          "description": "A finite, reproducible and budgeted sequence of FaultCampaign templates against one StacksNetwork.",
          "required": ["spec"],
          "properties": {
            "apiVersion": {"type": "string"},
            "kind": {"type": "string"},
            "metadata": {"type": "object"},
            "spec": {
              "type": "object",
              "required": ["networkRef", "seed", "campaignCatalog", "sequence", "budgets", "stopPolicy", "attributionPolicy", "replay", "resume", "minimization"],
              "properties": {
                "networkRef": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 63,
                  "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                },
                "seed": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 256,
                  "description": "Opaque reproducibility seed interpreted only by the named decision algorithm."
                },
                "decisionAlgorithm": {"type": "string", "minLength": 1, "maxLength": 128, "default": "hmac-sha256-decisions/v1"},
                "campaignCatalog": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 64,
                  "x-kubernetes-list-type": "map",
                  "x-kubernetes-list-map-keys": ["name"],
                  "items": {
                    "type": "object",
                    "required": ["name", "campaignRef"],
                    "properties": {
                      "name": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                      "campaignRef": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                      "expectedUID": {"type": "string", "minLength": 1, "maxLength": 128},
                      "expectedGeneration": {"type": "integer", "minimum": 1},
                      "expectedSpecDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"}
                    }
                  }
                },
                "sequence": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 256,
                  "x-kubernetes-list-type": "atomic",
                  "items": {
                    "type": "object",
                    "required": ["id", "campaign"],
                    "properties": {
                      "id": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                      "campaign": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                      "delayAfterSeconds": {"type": "integer", "minimum": 0, "maximum": 3600},
                      "enabled": {"type": "boolean", "default": true}
                    }
                  }
                },
                "budgets": {
                  "type": "object",
                  "required": ["maxCampaigns", "maxWallTimeSeconds", "maxCumulativeFaultSeconds", "maxActiveFaults", "maxSignerImpactPercent", "maxBurnchainFaults", "maxInconclusiveCampaigns"],
                  "properties": {
                    "maxCampaigns": {"type": "integer", "minimum": 1, "maximum": 256},
                    "maxWallTimeSeconds": {"type": "integer", "minimum": 60, "maximum": 86400},
                    "maxCumulativeFaultSeconds": {"type": "integer", "minimum": 1, "maximum": 36000},
                    "maxActiveFaults": {"type": "integer", "enum": [1], "default": 1},
                    "maxSignerImpactPercent": {"type": "integer", "minimum": 0, "maximum": 30},
                    "maxBurnchainFaults": {"type": "integer", "minimum": 0, "maximum": 10},
                    "maxInconclusiveCampaigns": {"type": "integer", "minimum": 0, "maximum": 64}
                  },
                  "x-kubernetes-validations": [{
                    "rule": "self.maxCumulativeFaultSeconds <= self.maxWallTimeSeconds",
                    "message": "maxCumulativeFaultSeconds cannot exceed maxWallTimeSeconds"
                  }]
                },
                "stopPolicy": {
                  "type": "object",
                  "required": ["onCampaignFailure", "onInconclusive", "onBudgetExhausted", "onSuccess"],
                  "properties": {
                    "onCampaignFailure": {"type": "string", "enum": ["Stop", "PauseForTriage"]},
                    "onInconclusive": {"type": "string", "enum": ["Stop", "PauseForTriage", "Continue"]},
                    "onBudgetExhausted": {"type": "string", "enum": ["Stop", "Pause"]},
                    "onSuccess": {"type": "string", "enum": ["Continue", "Stop"]}
                  }
                },
                "attributionPolicy": {
                  "type": "object",
                  "required": ["requiredOnFailure", "requireIncidentBundle", "allowedTerminalStates"],
                  "properties": {
                    "requiredOnFailure": {"type": "boolean", "enum": [true]},
                    "requireIncidentBundle": {"type": "boolean", "enum": [true]},
                    "allowedTerminalStates": {"type": "array", "minItems": 1, "maxItems": 3, "items": {"type": "string", "enum": ["Triaged", "Remediated", "Inconclusive"]}}
                  }
                },
                "replay": {
                  "type": "object",
                  "required": ["enabled", "requireSameResolvedImages", "verifyExpectedFailure"],
                  "properties": {
                    "enabled": {"type": "boolean"},
                    "sourceRunRef": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                    "descriptorURI": {"type": "string", "minLength": 1, "maxLength": 2048, "pattern": "^[A-Za-z][A-Za-z0-9+.-]*:"},
                    "descriptorDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                    "attemptId": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                    "expectedAssertion": {"type": "string", "minLength": 1, "maxLength": 63},
                    "expectedStatus": {"type": "string", "enum": ["Proven", "Failed", "Inconclusive"]},
                    "requireSameResolvedImages": {"type": "boolean"},
                    "verifyExpectedFailure": {"type": "boolean"}
                  },
                  "x-kubernetes-validations": [{
                    "rule": "!self.enabled || (has(self.sourceRunRef) && has(self.descriptorURI) && has(self.descriptorDigest) && has(self.attemptId) && (!self.verifyExpectedFailure || (has(self.expectedAssertion) && has(self.expectedStatus))))",
                    "message": "enabled replay requires sourceRunRef, descriptorURI, descriptorDigest, attemptId, and an assertion/status when expected-failure verification is enabled"
                  }]
                },
                "resume": {
                  "type": "object",
                  "required": ["enabled", "requireSameSeed", "requireSameResolvedImages"],
                  "properties": {
                    "enabled": {"type": "boolean"},
                    "sourceRunRef": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                    "afterInstructionId": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                    "requireSameSeed": {"type": "boolean", "enum": [true]},
                    "requireSameResolvedImages": {"type": "boolean", "enum": [true]}
                  },
                  "x-kubernetes-validations": [{
                    "rule": "!self.enabled || (has(self.sourceRunRef) && has(self.afterInstructionId))",
                    "message": "enabled resume requires sourceRunRef and afterInstructionId"
                  }]
                },
                "minimization": {
                  "type": "object",
                  "required": ["enabled", "strategy", "maxAttempts", "requireFreshNetwork"],
                  "properties": {
                    "enabled": {"type": "boolean"},
                    "strategy": {"type": "string", "enum": ["FailurePrefix", "DeltaDebug"]},
                    "maxAttempts": {"type": "integer", "minimum": 0, "maximum": 64},
                    "requireFreshNetwork": {"type": "boolean", "enum": [true]},
                    "sourceRunRef": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                    "sourceScheduleDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                    "attemptId": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                    "candidateScheduleDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                    "expectedAssertion": {"type": "string", "minLength": 1, "maxLength": 63},
                    "expectedStatus": {"type": "string", "enum": ["Proven", "Failed", "Inconclusive"]},
                    "retained": {
                      "type": "array", "minItems": 1, "maxItems": 256, "x-kubernetes-list-type": "atomic",
                      "items": {
                        "type": "object", "required": ["instructionId", "removedTargets", "removedParameters"],
                        "properties": {
                          "instructionId": {"type": "string", "minLength": 1, "maxLength": 63, "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"},
                          "removedTargets": {"type": "array", "maxItems": 100, "items": {"type": "string", "minLength": 1, "maxLength": 40, "pattern": "^[a-z]([-a-z0-9]*[a-z0-9])?$"}},
                          "removedParameters": {"type": "array", "maxItems": 64, "items": {"type": "string", "minLength": 1, "maxLength": 128}}
                        }
                      }
                    }
                  },
                  "x-kubernetes-validations": [
                    {
                      "rule": "self.enabled || self.maxAttempts == 0",
                      "message": "disabled minimization must use maxAttempts=0"
                    },
                    {
                      "rule": "!self.enabled || (self.strategy == 'DeltaDebug' && self.maxAttempts == 1 && has(self.sourceRunRef) && has(self.sourceScheduleDigest) && has(self.attemptId) && has(self.candidateScheduleDigest) && has(self.expectedAssertion) && has(self.expectedStatus) && has(self.retained))",
                      "message": "enabled minimization is one bounded DeltaDebug attempt and requires immutable source, candidate, expectation, and retained-action fields"
                    }
                  ]
                }
              },
              "x-kubernetes-validations": [
                {"rule": "self.sequence.size() <= self.budgets.maxCampaigns", "message": "ordered sequence exceeds maxCampaigns budget"},
                {"rule": "self.sequence.all(step, self.campaignCatalog.exists(campaign, campaign.name == step.campaign))", "message": "every sequence campaign must exist in campaignCatalog"},
                {"rule": "self.sequence.all(step, self.sequence.filter(other, other.id == step.id).size() == 1)", "message": "sequence instruction IDs must be unique"},
                {"rule": "!(self.replay.enabled && self.resume.enabled)", "message": "replay and resume cannot both be enabled"},
                {"rule": "!(self.minimization.enabled && (self.replay.enabled || self.resume.enabled))", "message": "a minimization attempt cannot also be replay or resume"}
              ]
            },
            "status": {
              "type": "object",
              "properties": {
                "observedGeneration": {"type": "integer", "minimum": 0},
                "phase": {"type": "string", "enum": ["Pending", "Preparing", "Running", "Paused", "Minimizing", "Passed", "Failed", "Aborted", "Inconclusive"]},
                "reason": {"type": "string", "maxLength": 128},
                "message": {"type": "string", "maxLength": 4096},
                "lastTransitionTime": {"type": "string", "format": "date-time"},
                "startedAt": {"type": "string", "format": "date-time"},
                "completedAt": {"type": "string", "format": "date-time"},
                "finishedAt": {"type": "string", "format": "date-time"},
                "activeCampaign": {"type": "string", "nullable": true, "maxLength": 63},
                "scheduleRef": {"type": "object", "required": ["name", "uid", "digest", "runGeneration", "runSpecDigest"], "properties": {
                  "name": {"type": "string", "minLength": 1, "maxLength": 63},
                  "uid": {"type": "string", "minLength": 1, "maxLength": 128},
                  "digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                  "runGeneration": {"type": "integer", "minimum": 1},
                  "runSpecDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"}
                }},
                "scheduleSummary": {"type": "object", "required": ["schemaVersion", "actions", "replay", "networkUid", "networkGeneration", "manifestDigest"], "properties": {
                  "schemaVersion": {"type": "string", "maxLength": 128},
                  "actions": {"type": "integer", "minimum": 0, "maximum": 256},
                  "replay": {"type": "boolean"},
                  "networkUid": {"type": "string", "minLength": 1, "maxLength": 128},
                  "networkGeneration": {"type": "integer", "minimum": 1},
                  "manifestDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                  "signerSetRewardCycle": {"type": "integer", "minimum": 0},
                  "signerSetTotalWeight": {"type": "integer", "minimum": 1},
                  "signerSetDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                  "signerSetObservedFrom": {"type": "string", "minLength": 1, "maxLength": 40},
                  "networkInventory": {"type": "object", "required": ["digest", "observedGeneration", "actors"], "properties": {
                    "digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                    "observedGeneration": {"type": "integer", "minimum": 1},
                    "observedAt": {"type": "string", "format": "date-time", "nullable": true},
                    "resourceVersion": {"type": "string", "nullable": true, "maxLength": 128},
                    "actors": {"type": "array", "minItems": 1, "maxItems": 100, "items": {"type": "object", "required": ["name", "role", "serviceName", "statefulSetName", "statefulSetUID", "controllerRevision", "podName", "podUID", "requestedImage", "runtimeImageID"], "properties": {
                      "name": {"type": "string", "maxLength": 40}, "role": {"type": "string", "maxLength": 32},
                      "serviceName": {"type": "string", "maxLength": 63}, "statefulSetName": {"type": "string", "maxLength": 63},
                      "statefulSetUID": {"type": "string", "maxLength": 128}, "controllerRevision": {"type": "string", "maxLength": 253},
                      "podName": {"type": "string", "maxLength": 253}, "podUID": {"type": "string", "maxLength": 128},
                      "requestedImage": {"type": "string", "maxLength": 2048}, "runtimeImageID": {"type": "string", "maxLength": 4096}
                    }}}
                  }}
                }},
                "activeChild": {"type": "object", "required": ["instructionId", "name", "uid"], "properties": {
                  "instructionId": {"type": "string", "maxLength": 63},
                  "name": {"type": "string", "maxLength": 63},
                  "uid": {"type": "string", "maxLength": 128},
                  "startedAt": {"type": "string", "format": "date-time"}
                }},
                "resolvedCampaigns": {"type": "array", "maxItems": 64, "x-kubernetes-list-type": "map", "x-kubernetes-list-map-keys": ["name"], "items": {"type": "object", "required": ["name", "sourceName", "sourceUID", "sourceGeneration", "specDigest"], "properties": {
                  "name": {"type": "string", "maxLength": 63},
                  "sourceName": {"type": "string", "maxLength": 63},
                  "sourceUID": {"type": "string", "maxLength": 128},
                  "sourceGeneration": {"type": "integer", "minimum": 1},
                  "specDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"}
                }}},
                "decisions": {"type": "array", "maxItems": 512, "x-kubernetes-list-type": "atomic", "items": {"type": "object", "required": ["index", "execution", "phase", "completedAt"], "properties": {
                  "index": {"type": "integer", "minimum": 0, "maximum": 1000000},
                  "execution": {"type": "string", "maxLength": 63},
                  "phase": {"type": "string", "enum": ["Passed", "Failed", "Inconclusive"]},
                  "completedAt": {"type": "string", "format": "date-time"},
                  "source": {"type": "string", "maxLength": 63},
                  "sequence": {"type": "integer", "minimum": 1, "maximum": 1000000},
                  "instructionId": {"type": "string", "maxLength": 63},
                  "campaign": {"type": "string", "maxLength": 63},
                  "childName": {"type": "string", "maxLength": 63},
                  "decision": {"type": "string", "enum": ["Selected", "Skipped", "Started", "Passed", "Failed", "Inconclusive", "Stopped"]},
                  "choiceDigest": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
                  "occurredAt": {"type": "string", "format": "date-time"},
                  "detailsDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"}
                }}},
                "budgetUsage": {"type": "object", "properties": {
                  "campaigns": {"type": "integer", "minimum": 0, "maximum": 256},
                  "campaignsStarted": {"type": "integer", "minimum": 0, "maximum": 256},
                  "campaignsCompleted": {"type": "integer", "minimum": 0, "maximum": 256},
                  "activeFaults": {"type": "integer", "minimum": 0, "maximum": 1},
                  "wallTimeSeconds": {"type": "number", "minimum": 0, "maximum": 86400},
                  "cumulativeFaultSeconds": {"type": "number", "minimum": 0, "maximum": 36000},
                  "maximumSignerImpactPercent": {"type": "number", "minimum": 0, "maximum": 100},
                  "burnchainFaults": {"type": "integer", "minimum": 0, "maximum": 10},
                  "inconclusiveCampaigns": {"type": "integer", "minimum": 0, "maximum": 64},
                  "minimizationAttempts": {"type": "integer", "minimum": 0, "maximum": 64}
                }},
                "identityDivergence": {"type": "object", "required": ["observedAt", "differences"], "properties": {
                  "expectedDigest": {"type": "string", "nullable": true, "pattern": "^sha256:[0-9a-f]{64}$"},
                  "currentDigest": {"type": "string", "nullable": true, "pattern": "^sha256:[0-9a-f]{64}$"},
                  "observedAt": {"type": "string", "format": "date-time"},
                  "differences": {"type": "array", "minItems": 1, "maxItems": 256, "items": {"type": "object", "required": ["scope", "field"], "properties": {
                    "scope": {"type": "string", "maxLength": 63}, "field": {"type": "string", "maxLength": 63},
                    "expected": {"x-kubernetes-int-or-string": true, "nullable": true}, "current": {"x-kubernetes-int-or-string": true, "nullable": true},
                    "message": {"type": "string", "maxLength": 1024}
                  }}}
                }},
                "identityTransitions": {"type": "array", "maxItems": 256, "items": {"type": "object", "required": ["campaign", "actors", "previousDigest", "currentDigest", "observedAt"], "properties": {
                  "campaign": {"type": "string", "maxLength": 63},
                  "actors": {"type": "array", "minItems": 1, "maxItems": 20, "items": {"type": "string", "maxLength": 40}},
                  "previousDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                  "currentDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                  "observedAt": {"type": "string", "format": "date-time"}
                }}},
                "attribution": {"type": "string", "enum": ["NotRequired", "Untriaged", "Triaged", "Remediated", "Inconclusive"]},
                "attributionURI": {"type": "string", "minLength": 1, "maxLength": 2048, "pattern": "^[A-Za-z][A-Za-z0-9+.-]*:"},
                "replayPlanURI": {"type": "string", "minLength": 1, "maxLength": 2048, "pattern": "^[A-Za-z][A-Za-z0-9+.-]*:"},
                "evidenceURI": {"type": "string", "minLength": 1, "maxLength": 2048, "pattern": "^[A-Za-z][A-Za-z0-9+.-]*:"},
                "evidenceDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                "terminalClassification": {
                  "type": "object",
                  "required": ["attemptId", "candidateScheduleDigest", "expectedAssertion", "expectedStatus", "outcome", "reason", "observationCount", "observations", "evidenceDigest", "evidenceURI", "causalMinimalityClaimed"],
                  "properties": {
                    "attemptId": {"type": "string", "minLength": 1, "maxLength": 63},
                    "candidateScheduleDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                    "expectedAssertion": {"type": "string", "minLength": 1, "maxLength": 63},
                    "expectedStatus": {"type": "string", "enum": ["Proven", "Failed", "Inconclusive"]},
                    "outcome": {"type": "string", "enum": ["FailureReproduced", "FailureAbsent", "Inconclusive"]},
                    "reason": {"type": "string", "minLength": 1, "maxLength": 128},
                    "observationCount": {"type": "integer", "minimum": 0, "maximum": 25600},
                    "observations": {"type": "array", "maxItems": 256, "items": {"type": "object", "required": ["child", "source", "outcome"], "properties": {
                      "child": {"type": "string", "maxLength": 63},
                      "source": {"type": "string", "enum": ["effect", "recovery"]},
                      "outcome": {"type": "string", "enum": ["Proven", "Failed", "Inconclusive"]},
                      "actor": {"type": "string", "maxLength": 63}
                    }}},
                    "evidenceDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                    "evidenceURI": {"type": "string", "minLength": 1, "maxLength": 2048, "pattern": "^[A-Za-z][A-Za-z0-9+.-]*:"},
                    "causalMinimalityClaimed": {"type": "boolean", "enum": [false]}
                  }
                },
                "cleanup": {"type": "object", "required": ["required", "completed"], "properties": {"required": {"type": "boolean"}, "completed": {"type": "boolean"}, "completedAt": {"type": "string", "format": "date-time"}, "message": {"type": "string", "maxLength": 2048}}},
                "conditions": {"type": "array", "maxItems": 16, "x-kubernetes-list-type": "map", "x-kubernetes-list-map-keys": ["type"], "items": {"type": "object", "required": ["type", "status", "reason", "message", "lastTransitionTime"], "properties": {
                  "type": {"type": "string", "maxLength": 128},
                  "status": {"type": "string", "enum": ["True", "False", "Unknown"]},
                  "reason": {"type": "string", "maxLength": 128},
                  "message": {"type": "string", "maxLength": 4096},
                  "observedGeneration": {"type": "integer", "minimum": 0},
                  "lastTransitionTime": {"type": "string", "format": "date-time"}
                }}}
              }
            }
          }
        }
      }
    }]
  }
}
