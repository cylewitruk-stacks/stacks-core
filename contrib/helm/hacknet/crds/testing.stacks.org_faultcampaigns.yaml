{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "faultcampaigns.testing.stacks.org",
    "labels": {"app.kubernetes.io/name": "hacknet"}
  },
  "spec": {
    "group": "testing.stacks.org",
    "scope": "Namespaced",
    "names": {
      "plural": "faultcampaigns",
      "singular": "faultcampaign",
      "kind": "FaultCampaign",
      "shortNames": ["fcampaign", "fcamp"],
      "categories": ["all"]
    },
    "versions": [{
      "name": "v1alpha1",
      "served": true,
      "storage": true,
      "additionalPrinterColumns": [
        {"name": "Phase", "type": "string", "jsonPath": ".status.phase"},
        {"name": "Network", "type": "string", "jsonPath": ".spec.networkRef"},
        {"name": "Fault", "type": "string", "jsonPath": ".spec.fault.type"},
        {"name": "Targets", "type": "integer", "jsonPath": ".status.resolvedTargetCount"},
        {"name": "Evidence", "type": "string", "jsonPath": ".status.evidenceURI", "priority": 1},
        {"name": "Age", "type": "date", "jsonPath": ".metadata.creationTimestamp"}
      ],
      "subresources": {"status": {}},
      "schema": {
        "openAPIV3Schema": {
          "type": "object",
          "description": "A bounded, disposable fault experiment against one StacksNetwork. Controllers should add a finalizer before injection and remove it only after recovery is observed.",
          "required": ["spec"],
          "properties": {
            "apiVersion": {"type": "string"},
            "kind": {"type": "string"},
            "metadata": {"type": "object"},
            "spec": {
              "type": "object",
              "required": ["networkRef", "target", "fault", "safety"],
              "properties": {
                "template": {
                  "type": "boolean",
                  "default": false,
                  "description": "When true, validate but do not inject this campaign; an AttacknetRun may snapshot it into an owned execution child."
                },
                "networkRef": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 63,
                  "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                },
                "target": {
                  "type": "object",
                  "properties": {
                    "actors": {
                      "type": "array",
                      "minItems": 1,
                      "maxItems": 20,
                      "items": {"type": "string", "minLength": 1, "maxLength": 40, "pattern": "^[a-z]([-a-z0-9]*[a-z0-9])?$"}
                    },
                    "roles": {
                      "type": "array",
                      "minItems": 1,
                      "maxItems": 7,
                      "items": {"type": "string", "enum": ["burnchain", "miner", "signer", "companion", "follower", "adversary", "infrastructure"]}
                    }
                  },
                  "x-kubernetes-validations": [{
                    "rule": "has(self.actors) || has(self.roles)",
                    "message": "target requires at least one actor or role selector"
                  }]
                },
                "fault": {
                  "type": "object",
                  "required": ["type", "mode", "duration", "parameters"],
                  "properties": {
                    "type": {"type": "string", "enum": ["pod", "network", "dns", "io", "io-pressure", "time"]},
                    "action": {
                      "type": "string",
                      "enum": ["pod-kill", "pod-failure", "container-kill", "netem", "delay", "loss", "duplicate", "corrupt", "partition", "bandwidth", "error", "random", "latency", "fault", "attrOverride", "mistake", "disk-pressure"]
                    },
                    "mode": {"type": "string", "enum": ["one", "all", "fixed", "fixed-percent", "random-max-percent"]},
                    "value": {
                      "x-kubernetes-int-or-string": true,
                      "anyOf": [
                        {"type": "integer"},
                        {"type": "string"}
                      ]
                    },
                    "duration": {"type": "string", "pattern": "^[0-9]+(ms|s|m|h)$", "maxLength": 16},
                    "parameters": {
                      "type": "object",
                      "properties": {
                        "containerNames": {"type": "array", "minItems": 1, "maxItems": 8, "items": {"type": "string", "minLength": 1, "maxLength": 63}},
                        "gracePeriod": {"type": "integer", "minimum": 0, "maximum": 3600},
                        "direction": {"type": "string", "enum": ["to", "from", "both"]},
                        "targetDevice": {"type": "string", "minLength": 1, "maxLength": 63},
                        "device": {"type": "string", "minLength": 1, "maxLength": 63},
                        "target": {
                          "type": "object",
                          "required": ["mode", "selector"],
                          "properties": {
                            "mode": {"type": "string", "enum": ["one", "all", "fixed", "fixed-percent", "random-max-percent"]},
                            "value": {
                              "x-kubernetes-int-or-string": true,
                              "anyOf": [
                                {"type": "integer"},
                                {"type": "string"}
                              ]
                            },
                            "selector": {
                              "type": "object",
                              "properties": {
                                "namespaces": {"type": "array", "minItems": 1, "maxItems": 16, "items": {"type": "string", "minLength": 1, "maxLength": 63}},
                                "labelSelectors": {"type": "object", "maxProperties": 32, "additionalProperties": {"type": "string", "maxLength": 253}},
                                "annotationSelectors": {"type": "object", "maxProperties": 32, "additionalProperties": {"type": "string", "maxLength": 253}},
                                "fieldSelectors": {"type": "object", "maxProperties": 32, "additionalProperties": {"type": "string", "maxLength": 253}},
                                "podPhaseSelectors": {"type": "array", "maxItems": 8, "items": {"type": "string", "maxLength": 32}},
                                "nodes": {"type": "array", "maxItems": 32, "items": {"type": "string", "maxLength": 253}},
                                "expressionSelectors": {"type": "array", "minItems": 1, "maxItems": 4, "items": {"type": "object", "required": ["key", "operator", "values"], "properties": {
                                  "key": {"type": "string", "minLength": 1, "maxLength": 253},
                                  "operator": {"type": "string", "enum": ["In", "NotIn", "Exists", "DoesNotExist"]},
                                  "values": {"type": "array", "minItems": 1, "maxItems": 20, "items": {"type": "string", "minLength": 1, "maxLength": 40}}
                                }}
                              }
                            }
                          }
                        }},
                        "peerTarget": {
                          "type": "object",
                          "properties": {
                            "actors": {"type": "array", "minItems": 1, "maxItems": 20, "items": {"type": "string", "minLength": 1, "maxLength": 40}},
                            "roles": {"type": "array", "minItems": 1, "maxItems": 7, "items": {"type": "string", "maxLength": 63}},
                            "mode": {"type": "string", "enum": ["one", "all", "fixed", "fixed-percent", "random-max-percent"]},
                            "value": {
                              "x-kubernetes-int-or-string": true,
                              "anyOf": [{"type": "integer"}, {"type": "string"}]
                            }
                          },
                          "x-kubernetes-validations": [{"rule": "has(self.actors) || has(self.roles)", "message": "peerTarget requires at least one actor or role selector"}]
                        },
                        "delay": {
                          "description": "Chaos Mesh Delay object for network faults, or duration string for IOChaos latency. The compiler performs the action-dependent type check.",
                          "x-kubernetes-preserve-unknown-fields": true
                        },
                        "loss": {
                          "type": "object",
                          "required": ["loss"],
                          "properties": {"loss": {"type": "string", "pattern": "^([0-9]|[1-9][0-9]|100)(\\.[0-9]+)?$", "maxLength": 16}, "correlation": {"type": "string", "pattern": "^([0-9]|[1-9][0-9]|100)(\\.[0-9]+)?$", "maxLength": 16}}
                        },
                        "duplicate": {
                          "type": "object",
                          "required": ["duplicate"],
                          "properties": {"duplicate": {"type": "string", "pattern": "^([0-9]|[1-9][0-9]|100)(\\.[0-9]+)?$", "maxLength": 16}, "correlation": {"type": "string", "pattern": "^([0-9]|[1-9][0-9]|100)(\\.[0-9]+)?$", "maxLength": 16}}
                        },
                        "corrupt": {
                          "type": "object",
                          "required": ["corrupt"],
                          "properties": {"corrupt": {"type": "string", "pattern": "^([0-9]|[1-9][0-9]|100)(\\.[0-9]+)?$", "maxLength": 16}, "correlation": {"type": "string", "pattern": "^([0-9]|[1-9][0-9]|100)(\\.[0-9]+)?$", "maxLength": 16}}
                        },
                        "bandwidth": {
                          "type": "object",
                          "required": ["rate"],
                          "properties": {
                            "rate": {"type": "string", "minLength": 1, "maxLength": 64},
                            "limit": {"type": "integer", "minimum": 1, "maximum": 2147483647},
                            "buffer": {"type": "integer", "minimum": 1, "maximum": 2147483647},
                            "peakrate": {"type": "string", "minLength": 1, "maxLength": 64},
                            "minburst": {"type": "integer", "minimum": 0, "maximum": 2147483647}
                          }
                        },
                        "externalTargets": {"type": "array", "minItems": 1, "maxItems": 16, "items": {"type": "string", "minLength": 1, "maxLength": 253}},
                        "patterns": {"type": "array", "minItems": 1, "maxItems": 32, "items": {"type": "string", "minLength": 1, "maxLength": 253}},
                        "volumePath": {"type": "string", "minLength": 1, "maxLength": 1024, "pattern": "^/"},
                        "path": {"type": "string", "minLength": 1, "maxLength": 1024, "pattern": "^/"},
                        "methods": {"type": "array", "minItems": 1, "maxItems": 16, "items": {"type": "string", "enum": ["READ", "WRITE", "FLUSH", "FSYNC", "FDATASYNC", "READDIR", "SYNC", "OPEN", "MKDIR", "MKNOD", "CHOWN", "CHMOD", "UTIMES", "LINK", "UNLINK", "RENAME"]}},
                        "errno": {"type": "integer", "minimum": 1, "maximum": 4095},
                        "percent": {"type": "integer", "minimum": 1, "maximum": 100},
                        "mistake": {
                          "type": "object",
                          "properties": {
                            "filling": {"type": "string", "enum": ["zero", "random"]},
                            "maxOccurrences": {"type": "integer", "minimum": 1, "maximum": 1000000},
                            "maxLength": {"type": "integer", "minimum": 1, "maximum": 1073741824}
                          }
                        },
                        "attr": {"type": "object", "minProperties": 1, "maxProperties": 16, "x-kubernetes-preserve-unknown-fields": true},
                        "timeOffset": {"type": "string", "pattern": "^[+-]?[0-9]+(ms|s|m|h)$", "maxLength": 32},
                        "clockIds": {"type": "array", "minItems": 1, "maxItems": 4, "items": {"type": "string", "enum": ["CLOCK_REALTIME", "CLOCK_MONOTONIC", "CLOCK_PROCESS_CPUTIME_ID", "CLOCK_THREAD_CPUTIME_ID"]}},
                        "severity": {"type": "string", "enum": ["low", "medium", "high"]},
                        "workers": {"type": "integer", "minimum": 1, "maximum": 4},
                        "bytesMiB": {"type": "integer", "minimum": 16, "maximum": 512},
                        "writeSizeKiB": {"type": "integer", "minimum": 4, "maximum": 1024},
                        "minimumLatencyMultiplier": {"type": "number", "minimum": 1.1, "maximum": 20},
                        "minimumAddedLatencyMs": {"type": "number", "minimum": 0.5, "maximum": 5000}
                      }
                    }
                  },
                  "x-kubernetes-validations": [
                    {"rule": "self.mode in ['fixed', 'fixed-percent', 'random-max-percent'] ? has(self.value) : !has(self.value)", "message": "fixed modes require value and one/all modes must omit it"},
                    {"rule": "self.type == 'time' ? !has(self.action) : has(self.action)", "message": "time faults omit action; every other fault requires it"},
                    {"rule": "self.type != 'pod' || self.action in ['pod-kill', 'pod-failure', 'container-kill']", "message": "invalid pod fault action"},
                    {"rule": "self.type != 'network' || self.action in ['netem', 'delay', 'loss', 'duplicate', 'corrupt', 'partition', 'bandwidth']", "message": "invalid network fault action"},
                    {"rule": "self.type != 'dns' || self.action in ['error', 'random']", "message": "invalid DNS fault action"},
                    {"rule": "self.type != 'io' || self.action in ['latency', 'fault', 'attrOverride', 'mistake']", "message": "invalid I/O fault action"},
                    {"rule": "self.type != 'io-pressure' || self.action == 'disk-pressure'", "message": "invalid I/O-pressure fault action"},
                    {"rule": "self.type != 'network' || !has(self.parameters.target) || !has(self.parameters.peerTarget)", "message": "network faults may use target or peerTarget, not both"},
                    {"rule": "self.type != 'network' || self.action != 'loss' || has(self.parameters.loss)", "message": "network loss requires parameters.loss"},
                    {"rule": "self.type != 'network' || self.action != 'duplicate' || has(self.parameters.duplicate)", "message": "network duplicate requires parameters.duplicate"},
                    {"rule": "self.type != 'network' || self.action != 'corrupt' || has(self.parameters.corrupt)", "message": "network corrupt requires parameters.corrupt"},
                    {"rule": "self.type != 'network' || self.action != 'partition' || has(self.parameters.target) || has(self.parameters.peerTarget) || has(self.parameters.externalTargets)", "message": "network partition requires peerTarget, target, or externalTargets"},
                    {"rule": "self.type != 'network' || self.action != 'bandwidth' || has(self.parameters.bandwidth)", "message": "network bandwidth requires parameters.bandwidth"},
                    {"rule": "self.type != 'dns' || has(self.parameters.patterns)", "message": "DNS faults require parameters.patterns"},
                    {"rule": "self.type != 'io' || has(self.parameters.volumePath)", "message": "I/O faults require parameters.volumePath"},
                    {"rule": "self.type != 'io' || self.action != 'fault' || has(self.parameters.errno)", "message": "I/O fault requires parameters.errno"},
                    {"rule": "self.type != 'io' || self.action != 'mistake' || has(self.parameters.mistake)", "message": "I/O mistake requires parameters.mistake"},
                    {"rule": "self.type != 'io' || self.action != 'attrOverride' || has(self.parameters.attr)", "message": "I/O attrOverride requires parameters.attr"},
                    {"rule": "self.type != 'io-pressure' || has(self.parameters.severity) && has(self.parameters.workers) && has(self.parameters.bytesMiB) && has(self.parameters.writeSizeKiB) && has(self.parameters.minimumLatencyMultiplier) && has(self.parameters.minimumAddedLatencyMs)", "message": "I/O pressure requires a structured bounded resource and evidence profile"},
                    {"rule": "self.type != 'time' || has(self.parameters.timeOffset)", "message": "time faults require parameters.timeOffset"}
                  ]
                },
                "safety": {
                  "type": "object",
                  "properties": {
                    "maxUnavailableSignerPercent": {"type": "number", "minimum": 0, "maximum": 100, "default": 30},
                    "maxUnavailableMinerPercent": {"type": "number", "minimum": 0, "maximum": 100, "default": 50},
                    "allowQuorumLoss": {"type": "boolean", "default": false},
                    "allowBurnchain": {"type": "boolean", "default": false},
                    "allowExtendedDuration": {"type": "boolean", "default": false},
                    "allowExtremeSeverity": {"type": "boolean", "default": false},
                    "allowMinerMajorityOutage": {"type": "boolean", "default": false},
                    "allowUnenrolledNetworkTargets": {"type": "boolean", "default": false}
                  },
                  "x-kubernetes-validations": [
                    {"rule": "!has(self.maxUnavailableSignerPercent) || self.maxUnavailableSignerPercent <= 30 || (has(self.allowQuorumLoss) && self.allowQuorumLoss)", "message": "signer impact above 30 percent requires allowQuorumLoss=true"},
                    {"rule": "!has(self.maxUnavailableMinerPercent) || self.maxUnavailableMinerPercent <= 50 || (has(self.allowMinerMajorityOutage) && self.allowMinerMajorityOutage)", "message": "miner impact above 50 percent requires allowMinerMajorityOutage=true"}
                  ]
                },
                "effectAssertions": {"type": "array", "maxItems": 16, "items": {"type": "object", "required": ["type"], "properties": {
                  "type": {"type": "string", "enum": ["PodRestarted", "PodUnavailable", "NetworkDegraded", "DNSDegraded", "IODegraded", "IOPressureObserved", "ClockSkewObserved"]},
                  "actor": {"type": "string", "minLength": 1, "maxLength": 40, "pattern": "^[a-z]([-a-z0-9]*[a-z0-9])?$"},
                  "timeoutSeconds": {"type": "integer", "minimum": 1, "maximum": 600}
                }}},
                "recoveryAssertions": {"type": "array", "maxItems": 16, "items": {"type": "object", "required": ["type"], "properties": {
                  "type": {"type": "string", "enum": ["TargetReady", "NetworkRecovered", "DNSRecovered", "IORecovered", "IOPressureRecovered", "ClockSkewCleared", "ChainProgress"]},
                  "actor": {"type": "string", "minLength": 1, "maxLength": 40, "pattern": "^[a-z]([-a-z0-9]*[a-z0-9])?$"},
                  "timeoutSeconds": {"type": "integer", "minimum": 1, "maximum": 600}
                }}}
              },
              "x-kubernetes-validations": [
                {"rule": "!has(self.target.roles) || !('burnchain' in self.target.roles) || (has(self.safety.allowBurnchain) && self.safety.allowBurnchain)", "message": "burnchain role selection requires allowBurnchain=true"},
                {"rule": "self.fault.type != 'time' || !has(self.fault.parameters.containerNames) || size(self.fault.parameters.containerNames) <= 1", "message": "TimeChaos may select at most one container per Pod"},
                {"rule": "self.fault.type != 'io-pressure' || has(self.fault.parameters.containerNames) && size(self.fault.parameters.containerNames) == 1 && self.fault.parameters.containerNames[0] == 'actor'", "message": "disk-pressure must select exactly the actor container per Pod"},
                {"rule": "self.fault.type != 'io-pressure' || has(self.target.actors) && size(self.target.actors) == 1 && (!has(self.target.roles) || size(self.target.roles) == 0)", "message": "disk-pressure must name exactly one actor target"},
                {"rule": "self.fault.type != 'io-pressure' || duration(self.fault.duration) <= duration('5m')", "message": "disk-pressure duration must not exceed 5m"},
                {"rule": "self.fault.type != 'io-pressure' || self.fault.parameters.writeSizeKiB <= self.fault.parameters.bytesMiB * 1024", "message": "disk-pressure write size must not exceed total bytes"},
                {"rule": "self.fault.type != 'io-pressure' || self.fault.parameters.severity != 'low' || self.fault.parameters.workers <= 1 && self.fault.parameters.bytesMiB <= 64 && duration(self.fault.duration) <= duration('60s')", "message": "low disk-pressure exceeds its resource or duration profile"},
                {"rule": "self.fault.type != 'io-pressure' || self.fault.parameters.severity != 'medium' || self.fault.parameters.workers <= 2 && self.fault.parameters.bytesMiB <= 256 && duration(self.fault.duration) <= duration('180s')", "message": "medium disk-pressure exceeds its resource or duration profile"},
                {"rule": "self.fault.type != 'io-pressure' || self.fault.parameters.severity != 'high' || (has(self.safety.allowExtremeSeverity) && self.safety.allowExtremeSeverity)", "message": "high disk-pressure severity requires allowExtremeSeverity=true"},
                {"rule": "(has(self.safety.allowExtendedDuration) && self.safety.allowExtendedDuration) || duration(self.fault.duration) <= duration('10m')", "message": "faults longer than 10m require allowExtendedDuration=true"},
                {"rule": "duration(self.fault.duration) > duration('0s') && duration(self.fault.duration) <= duration('24h')", "message": "fault duration must be greater than zero and at most 24h"},
                {"rule": "!has(self.fault.parameters.target) && !has(self.fault.parameters.externalTargets) || (has(self.safety.allowUnenrolledNetworkTargets) && self.safety.allowUnenrolledNetworkTargets)", "message": "raw target or externalTargets require allowUnenrolledNetworkTargets=true"}
              ]
            },
            "status": {
              "type": "object",
              "properties": {
                "observedGeneration": {"type": "integer", "minimum": 0},
                "phase": {"type": "string", "enum": ["Pending", "Admitted", "Injecting", "Active", "Recovering", "Passed", "Failed", "Inconclusive"]},
                "reason": {"type": "string", "maxLength": 128},
                "message": {"type": "string", "maxLength": 4096},
                "lastTransitionTime": {"type": "string", "format": "date-time"},
                "templateDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                "admission": {"type": "object", "required": ["networkUid", "networkGeneration", "compiledDigest", "admittedAt", "signerImpact", "minerImpact"], "properties": {
                  "networkUid": {"type": "string", "minLength": 1, "maxLength": 128},
                  "networkGeneration": {"type": "integer", "minimum": 1},
                  "compiledDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                  "admittedAt": {"type": "string", "format": "date-time"},
                  "signerSetRewardCycle": {"type": "integer", "minimum": 0},
                  "signerSetTotalWeight": {"type": "integer", "minimum": 1},
                  "signerSetDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
                  "signerSetObservedFrom": {"type": "string", "minLength": 1, "maxLength": 40},
                  "signerImpact": {"type": "object", "required": ["totalWeight", "affectedWeight", "percent"], "properties": {
                    "totalWeight": {"type": "number", "minimum": 0}, "affectedWeight": {"type": "number", "minimum": 0}, "percent": {"type": "number", "minimum": 0, "maximum": 100}
                  }},
                  "minerImpact": {"type": "object", "required": ["totalCount", "affectedCount", "percent"], "properties": {
                    "totalCount": {"type": "integer", "minimum": 0}, "affectedCount": {"type": "integer", "minimum": 0}, "percent": {"type": "number", "minimum": 0, "maximum": 100}
                  }}
                }},
                "resolvedTargetCount": {"type": "integer", "minimum": 0, "maximum": 100},
                "resolvedTargets": {"type": "array", "maxItems": 100, "items": {"type": "object", "required": ["actor", "role", "pod", "podUid", "podIP", "node", "restartCount"], "properties": {
                  "actor": {"type": "string", "maxLength": 40},
                  "role": {"type": "string", "maxLength": 32},
                  "pod": {"type": "string", "maxLength": 253},
                  "podUid": {"type": "string", "minLength": 1, "maxLength": 128},
                  "podIP": {"type": "string", "minLength": 2, "maxLength": 64},
                  "node": {"type": "string", "maxLength": 253},
                  "requestedImage": {"type": "string", "nullable": true, "maxLength": 2048},
                  "resolvedImageId": {"type": "string", "nullable": true, "maxLength": 4096},
                  "restartCount": {"type": "integer", "minimum": 0, "maximum": 2147483647}
                }}},
                "capabilityEvidence": {"type": "array", "maxItems": 100, "items": {"type": "object", "required": ["actor", "podUid", "source", "observedAt", "platform", "architecture", "supported", "reason"], "properties": {
                  "actor": {"type": "string", "minLength": 1, "maxLength": 63},
                  "podUid": {"type": "string", "minLength": 1, "maxLength": 128},
                  "source": {"type": "string", "enum": ["attacknet-probe/v1", "attacknet-run-operator/v1"]},
                  "observedAt": {"type": "string", "format": "date-time"},
                  "platform": {"type": "string", "minLength": 1, "maxLength": 32},
                  "architecture": {"type": "string", "minLength": 1, "maxLength": 32},
                  "supported": {"type": "boolean"},
                  "reason": {"type": "string", "minLength": 1, "maxLength": 1024}
                }}},
                "chaos": {"type": "object", "required": ["kind", "name", "uid", "createdAt"], "properties": {
                  "kind": {"type": "string", "enum": ["PodChaos", "NetworkChaos", "DNSChaos", "IOChaos", "IOPressurePod", "TimeChaos"]},
                  "name": {"type": "string", "maxLength": 63},
                  "uid": {"type": "string", "maxLength": 128},
                  "createdAt": {"type": "string", "format": "date-time"},
                  "mechanism": {"type": "string", "enum": ["controller-owned-io-pressure-pod"]},
                  "resourceDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"}
                }},
                "injectedAt": {"type": "string", "format": "date-time"},
                "actualInjection": {"type": "object", "properties": {
                  "allInjectedObserved": {"type": "boolean"},
                  "chaosResourceVersion": {"type": "string", "maxLength": 128},
                  "records": {"nullable": true, "x-kubernetes-preserve-unknown-fields": true},
                  "mechanism": {"type": "string", "enum": ["controller-owned-io-pressure-pod"]},
                  "podUid": {"type": "string", "maxLength": 128},
                  "image": {"type": "string", "maxLength": 2048},
                  "imageID": {"type": "string", "maxLength": 4096},
                  "node": {"type": "string", "maxLength": 253},
                  "phase": {"type": "string", "enum": ["Pending", "Running", "Succeeded", "Failed", "Unknown"]},
                  "targetActor": {"type": "string", "maxLength": 63},
                  "targetPodUid": {"type": "string", "maxLength": 128},
                  "pvcClaim": {"type": "string", "maxLength": 253},
                  "observedAt": {"type": "string", "format": "date-time"}
                }},
                "probeArtifacts": {"type": "object", "properties": {
                  "beforeJson": {"type": "string", "maxLength": 131072},
                  "duringJson": {"type": "string", "maxLength": 131072},
                  "afterJson": {"type": "string", "maxLength": 131072}
                }},
                "effectResults": {"type": "array", "maxItems": 100, "items": {"type": "object", "required": ["outcome"], "properties": {
                  "assertion": {"type": "string", "maxLength": 63}, "outcome": {"type": "string", "enum": ["Proven", "Failed", "Inconclusive"]}, "actor": {"type": "string", "maxLength": 63}, "podUid": {"type": "string", "maxLength": 128}, "observedAt": {"type": "string", "format": "date-time"}, "observedValue": {"type": "number"}, "message": {"type": "string", "maxLength": 2048}
                }}},
