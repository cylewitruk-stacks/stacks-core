{{- if .Values.runOperator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hacknet.runOperatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hacknet.labels" . | nindent 4 }}
    app.kubernetes.io/component: run-operator
spec:
  replicas: {{ .Values.runOperator.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hacknet.runOperatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hacknet.runOperatorSelectorLabels" . | nindent 8 }}
        {{- with .Values.runOperator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.runOperator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hacknet.runServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.runOperator.podSecurityContext | nindent 8 }}
      {{- with .Values.runOperator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: run-operator
          image: "{{ .Values.runOperator.image.repository }}:{{ .Values.runOperator.image.tag }}"
          imagePullPolicy: {{ .Values.runOperator.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.runOperator.securityContext | nindent 12 }}
          env:
            - name: WATCH_NAMESPACE
              value: {{ include "hacknet.watchNamespace" . | quote }}
            - name: RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.runOperator.reconcileIntervalSeconds | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.runOperator.logLevel | quote }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.runOperator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.serviceAccount.tokenExpirationSeconds }}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {apiVersion: v1, fieldPath: metadata.namespace}
      {{- with .Values.runOperator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runOperator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runOperator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
