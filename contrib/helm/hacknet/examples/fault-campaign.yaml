apiVersion: testing.stacks.org/v1beta1
kind: FaultCampaign
metadata:
  name: mixed-peer-disruption
  namespace: hacknet-system
spec:
  template: true
  safety:
    maxUnavailableSignerBasisPoints: 3000
    maxUnavailableMinerBasisPoints: 5000
    maxConcurrentFaults: 2
  stages:
    - id: isolate-miner
      faults:
        - id: miner-delay
          target:
            actors: [miner-2]
            mode: all
          fault:
            type: network
            action: delay
            mode: all
            duration: 45s
            parameters:
              direction: both
              peerTarget:
                roles: [follower]
                mode: all
              delay:
                latency: 750ms
                jitter: 200ms
                correlation: "50"
          effectAssertions:
            - type: NetworkDegraded
              actor: miner-2
              timeoutSeconds: 90
          recoveryAssertions:
            - type: NetworkRecovered
              actor: miner-2
              timeoutSeconds: 300
    - id: degrade-follower-dns
      trigger:
        afterStage:
          stage: isolate-miner
          state: Effective
          delay: 5s
      faults:
        - id: follower-dns-error
          target:
            actors: [follower-1]
            mode: all
          fault:
            type: dns
            action: error
            mode: all
            duration: 20s
            parameters:
              patterns: ["attacknet-miner-1.hacknet-system.svc.cluster.local"]
              containerNames: [actor, attacknet-probe]
          effectAssertions:
            - type: DNSDegraded
              actor: follower-1
              timeoutSeconds: 60
          recoveryAssertions:
            - type: DNSRecovered
              actor: follower-1
              timeoutSeconds: 180
