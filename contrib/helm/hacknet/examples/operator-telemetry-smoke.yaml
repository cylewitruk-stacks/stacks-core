# Create a disposable token before applying this example:
#   kubectl create secret generic operator-smoke-token \
#     --from-literal=token=local-smoke-token
apiVersion: testing.stacks.org/v1alpha1
kind: StacksNetwork
metadata:
  name: operator-telemetry-smoke
spec:
  defaults:
    imagePullPolicy: IfNotPresent
    storage:
      enabled: false
  telemetry:
    enabled: false
  actors:
    - name: otlp-sink
      role: infrastructure
      image: python:3.12-slim
      command: [python, -u, -c]
      args:
        - |
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
              def do_POST(self):
                  size = int(self.headers.get("Content-Length", "0"))
                  self.rfile.read(size)
                  print(f"path={self.path} authorization={self.headers.get('Authorization')} bytes={size}", flush=True)
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *_args):
                  return
          HTTPServer(("0.0.0.0", 4318), Handler).serve_forever()
      ports:
        - name: otlp
          containerPort: 4318
      readinessProbe:
        tcpSocket:
          port: otlp
        periodSeconds: 2

    - name: observed
      role: infrastructure
      image: busybox:1.36.1
      command: [sh, -ec]
      args:
        - |
          mkdir -p /tmp/metrics
          printf '# TYPE hacknet_smoke gauge\nhacknet_smoke 1\n' > /tmp/metrics/metrics
          exec httpd -f -p 20446 -h /tmp/metrics
      ports:
        - name: metrics
          containerPort: 20446
      dependencies:
        - actor: otlp-sink
          port: 4318
      readinessProbe:
        httpGet:
          path: /metrics
          port: metrics
        periodSeconds: 2
      telemetry:
        enabled: true
        metricsPort: 20446
        exporterEndpoint: http://${SERVICE:otlp-sink}:4318
        tokenSecretRef:
          name: operator-smoke-token
          key: token
