          index: 5
          weight: 3
          burnchainNodeRef: bitcoin
          signerConfig: {secretRef: {name: accepted-28-signer-5, key: signer.toml}}
          nodeConfig: {generated: {profile: nakamoto-regtest-node/v1}}
        - name: signer-6
          nodeName: signer-node-6
          index: 6
          weight: 4
          burnchainNodeRef: bitcoin
          signerConfig: {secretRef: {name: accepted-28-signer-6, key: signer.toml}}
          nodeConfig: {generated: {profile: nakamoto-regtest-node/v1}}
        - name: signer-7
          nodeName: signer-node-7
          index: 7
          weight: 1
          burnchainNodeRef: bitcoin
          signerConfig: {secretRef: {name: accepted-28-signer-7, key: signer.toml}}
          nodeConfig: {generated: {profile: nakamoto-regtest-node/v1}}
        - name: signer-8
          nodeName: signer-node-8
          index: 8
