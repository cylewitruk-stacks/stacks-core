          nodeConfig: {generated: {profile: nakamoto-regtest-node/v1}}
        - name: signer-9
          nodeName: signer-node-9
          index: 9
          weight: 4
          burnchainNodeRef: bitcoin
          signerConfig: {secretRef: {name: accepted-28-signer-9, key: signer.toml}}
          nodeConfig: {generated: {profile: nakamoto-regtest-node/v1}}
        - name: signer-10
          nodeName: signer-node-10
          index: 10
          weight: 1
          burnchainNodeRef: bitcoin
          signerConfig: {secretRef: {name: accepted-28-signer-10, key: signer.toml}}
          nodeConfig: {generated: {profile: nakamoto-regtest-node/v1}}
  enrollment:
    name: stacker
    image: stacks-attacknet-stacker:local
    nodeRef: miner-1
    credentialsSecretRef:
      name: accepted-28-stacker-credentials
      keysKey: private-keys
      addressesKey: addresses
