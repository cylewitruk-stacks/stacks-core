[package]
name = "marf-bench-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "marf-bench"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", default-features = false }
tempfile = { version = "3.20", default-features = false }
