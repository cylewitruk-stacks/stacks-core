data_url = "http://127.0.0.1:20443"
p2p_address = "127.0.0.1:20444"
prometheus_bind = "0.0.0.0:20446"
working_dir = "/data/node"
seed = "9e446f6b0c6a96cf2190e54bcd5a8569c3e386f091605499464389b8d4e0bfc201"
local_peer_seed = "1111111111111111111111111111111111111111111111111111111111111111"
miner = true
stacker = true
use_test_genesis_chainstate = true
pox_5_sbtc_contract = "ST24VB7FBXCBV6P0SRDSPSW0Y2J9XHDXNHW9Q8S7H.sbtc-token"
pox_5_sbtc_registry_contract = "ST24VB7FBXCBV6P0SRDSPSW0Y2J9XHDXNHW9Q8S7H.sbtc-registry"
pox_sync_sample_secs = 0
wait_time_for_blocks = 0
wait_time_for_microblocks = 0
mine_microblocks = false

[node.libp2p]
rollout_mode = "libp2p-only"
kademlia_server = true
bind = ["/ip4/0.0.0.0/tcp/20445"]
advertise = ["/dns4/stacks-node/tcp/20445/p2p/16Uiu2HAmU1MbqEPd87m36aZWn6qKUtPumc2SthnzhF4h2RXz4wTS"]
direct_block_push = true
direct_push_fanout = 3

[node.libp2p.signer_bridge]
mode = "off"

[miner]
first_attempt_time_ms = 1000
subsequent_attempt_time_ms = 2000
mining_key = "19ec1c3e31d139c989a23a27eac60d1abfad5277d3ae9604242514c738258efa01"
block_reward_recipient = "STQM73RQC4EX0A07KWG1J5ECZJYBZS4SJ4ERC6WN"
activated_vrf_key_path = "/data/node/activated-vrf-key.json"

[connection_options]
disable_block_download = true
disable_inbound_handshakes = true
disable_inbound_walks = true
public_ip_address = "127.0.0.1:20444"
auth_token = "12345"

[burnchain]
chain = "bitcoin"
mode = "nakamoto-neon"
poll_time_secs = 1
magic_bytes = "T3"
pox_prepare_length = 5
pox_reward_length = 20
burn_fee_cap = 20000
peer_host = "bitcoin"
