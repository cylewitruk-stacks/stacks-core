[package]
name = "stacks-rpc"
version = "0.1.0"
edition = "2021"

[lib]
name = "stacks_rpc"
path = "src/lib.rs"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clarity = { path = "../clarity" }
r2d2 = "0.8.10"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
slog = { workspace = true }
stacks = { package = "stackslib", path = "../stackslib", features = ["axum-rpc"] }
stacks-common = { path = "../stacks-common" }
tokio = { version = "1.15", features = ["net", "rt-multi-thread"] }

[dev-dependencies]
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls", "rustls-tls"] }
