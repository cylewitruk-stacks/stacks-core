[package]
name = "stacks-common"
version = "0.0.1"
authors = [
    "Jude Nelson <jude@stacks.org>",
    "Aaron Blankstein <aaron@blockstack.com>",
    "Ludo Galabru <ludovic@blockstack.com>",
]
license = "GPLv3"
homepage = "https://github.com/blockstack/stacks-blockchain"
repository = "https://github.com/blockstack/stacks-blockchain"
description = "Common modules for blockstack_lib, libclarity"
keywords = [
    "stacks",
    "stx",
    "bitcoin",
    "crypto",
    "blockstack",
    "decentralized",
    "dapps",
    "blockchain",
]
edition = "2021"
build = "build.rs"

[lib]
name = "stacks_common"
path = "./src/libcommon.rs"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["serde"] }
ed25519-dalek = { workspace = true }
hashbrown = { workspace = true }
lazy_static = { workspace = true }
ripemd = { version = "0.1.1", default-features = false }
serde = { workspace = true , features = ["derive"] }
serde_derive = { workspace = true }
serde_json = { workspace = true }
sha3 = { version = "0.10.1", default-features = false }
slog = { workspace = true }
slog-term = { version = "2.6.0", default-features = false }
stacks-codec = { workspace = true }
stacks-crypto = { workspace = true, default-features = false }
stacks-p2p = { workspace = true }
stacks-primitives = { workspace = true }
stacks-protocol = { workspace = true }
thiserror = { workspace = true }

# RustCrypto elliptic curve crates
p256 = { version = "0.13", default-features = false, features = ["std", "serde", "ecdsa"] }

# Optional dependencies
getrandom = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
slog-json = { version = "2.3.0", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
nix = {version = "0.23", default-features = false, optional = true}

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "consoleapi",
    "handleapi",
    "synchapi",
    "winbase",
], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { workspace = true, optional = true }

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64"), not(any(target_os="windows"))))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(any(not(any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")), any(target_os="windows")))'.dependencies]
sha2 = { version = "0.10" }

[dev-dependencies]
proptest = "1.6.0"
pinny = { workspace = true }
stacks-protocol = { workspace = true, features = ["testing"] }

[target.'cfg(windows)'.dev-dependencies]
winapi = { version = "0.3", features = ["fileapi", "processenv", "winnt"] }

[build-dependencies]
toml = { workspace = true }

[features]
default = ["developer-mode", "ctrlc-handler", "rand"]
developer-mode = []
# Enables graceful shutdown handling for Ctrl+C (SIGINT) signals.
# This pulls in the `nix` or `winapi` dependency.
ctrlc-handler = ["dep:nix", "dep:winapi"]
slog_json = ["slog-json"]
rusqlite = ["dep:rusqlite", "rand"]
# Enables the rand module. This flag must be off on deterministic
# platforms such as CosmWasm
rand = ["dep:rand", "stacks-crypto/rand"]
serde = []
testing = ["rand", "stacks-crypto/testing", "stacks-protocol/testing"]
bech32_std = []
bech32_strict = []

# Wasm-specific features for easier configuration
wasm-web = ["rand", "getrandom/js", "stacks-crypto/wasm-web"]
wasm-deterministic = ["getrandom/custom", "stacks-crypto/wasm-deterministic"]

[package.metadata.pinny]
allowed = ["t_prop"]
